<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>第二章 · 语言记忆</title>
    <style>
        /* ===== 全局重置 & 移动端适配 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fb;
            color: #1a2332;
            padding: 12px 12px 100px 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        /* ===== 顶栏 ===== */
        .header {
            background: #fff;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 700;
        }
        .header-title span {
            color: #2d7d46;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-home {
            font-size: 13px;
            color: #1a5276;
            background: #e3eef7;
            padding: 5px 12px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .header-stats {
            font-size: 13px;
            color: #6b7a8f;
            background: #f0f2f5;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #e8ecf1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-fill {
            height: 100%;
            background: #2d7d46;
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7a8f;
            margin-top: 4px;
        }
        /* ===== 筛选栏 ===== */
        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .filter-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid #d0d7e2;
            background: #fff;
            font-size: 12px;
            color: #3d4e62;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
