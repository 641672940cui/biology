<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>第六章 · 语言记忆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fb;
            color: #1a2332;
            padding: 12px 12px 100px 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            background: #fff;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 700;
        }
        .header-title span {
            color: #2d7d46;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-home {
            font-size: 13px;
            color: #1a5276;
            background: #e3eef7;
            padding: 5px 12px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .header-stats {
            font-size: 13px;
            color: #6b7a8f;
            background: #f0f2f5;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #e8ecf1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-fill {
            height: 100%;
            background: #2d7d46;
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7a8f;
            margin-top: 4px;
        }
        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .filter-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid #d0d7e2;
            background: #fff;
            font-size: 12px;
            color: #3d4e62;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #2d7d46;
            border-color: #2d7d46;
            color: #fff;
        }
        .filter-btn.wrong-filter {
            border-color: #c0392b;
            color: #c0392b;
        }
        .filter-btn.wrong-filter.active {
            background: #c0392b;
            border-color: #c0392b;
            color: #fff;
        }
        .question-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px 16px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .question-type {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: #2d7d46;
            background: #e6f3ea;
            padding: 2px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .question-section {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            color: #6b7a8f;
            background: #f0f2f5;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .question-text {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .question-text .blank {
            display: inline-block;
            min-width: 70px;
            border-bottom: 2px dashed #2d7d46;
            margin: 0 4px;
            color: #2d7d46;
            font-weight: 600;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 10px;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #e2e7ef;
            background: #fff;
            font-size: 15px;
            line-height: 1.5;
            cursor: pointer;
            font-family: inherit;
            min-height: 48px;
            transition: all 0.2s;
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .option-btn.selected-correct {
            border-color: #2d7d46;
            background: #e8f5ee;
        }
        .option-btn.selected-wrong {
            border-color: #c0392b;
            background: #fde8e6;
        }
        .option-btn.show-correct {
            border-color: #2d7d46;
            background: #e8f5ee;
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.8;
        }
        .option-label {
            font-weight: 700;
            color: #6b7a8f;
            margin-right: 8px;
        }
        .fill-input-area {
            margin: 12px 0 10px;
        }
        .fill-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .fill-row label {
            font-weight: 500;
            color: #3d4e62;
            min-width: 30px;
            font-size: 15px;
        }
        .fill-row input {
            flex: 1;
            min-width: 100px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 2px solid #e2e7ef;
            font-size: 15px;
            font-family: inherit;
            background: #fff;
            color: #1a2332;
            min-height: 44px;
            transition: border 0.2s;
        }
        .fill-row input:focus {
            outline: none;
            border-color: #2d7d46;
        }
        .fill-row input.correct {
            border-color: #2d7d46;
            background: #e8f5ee;
        }
        .fill-row input.wrong {
            border-color: #c0392b;
            background: #fde8e6;
        }
        .fill-row input:disabled {
            opacity: 0.7;
        }
        .fill-row .correct-answer-hint {
            font-size: 14px;
            color: #2d7d46;
            font-weight: 600;
        }
        .explanation {
            background: #f8faff;
            border-radius: 12px;
            padding: 14px 16px;
            margin: 12px 0 6px;
            border-left: 4px solid #2d7d46;
            display: none;
            font-size: 14px;
            line-height: 1.7;
            color: #2c3e50;
        }
        .explanation.show {
            display: block;
        }
        .tip-yellow {
            background: #fcf8e3;
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid #f0ad4e;
            margin-top: 6px;
            font-size: 14px;
        }
        .tip-yellow strong {
            color: #8a6d3b;
        }
        .mnemonic {
            background: #f0f7f4;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #1a6b3c;
            margin-top: 6px;
            border-left: 3px solid #2d7d46;
        }
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn-primary {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #2d7d46;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            min-height: 48px;
            transition: all 0.2s;
        }
        .btn-primary:active {
            transform: scale(0.97);
            background: #236a3a;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .wrong-tag {
            display: inline-block;
            background: #c0392b;
            color: #fff;
            font-size: 11px;
            padding: 1px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .status-badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .status-badge.done {
            background: #e8f5ee;
            color: #2d7d46;
        }
        .status-badge.wrong {
            background: #fde8e6;
            color: #c0392b;
        }
        .complete-screen {
            text-align: center;
            padding: 40px 20px;
        }
        .complete-screen .big-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .complete-screen h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .complete-screen .score-big {
            font-size: 48px;
            font-weight: 700;
            color: #2d7d46;
            margin: 16px 0;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7a8f;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .wrong-list-view {
            background: #fff;
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }
        .wrong-list-view .title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .wrong-list-view .item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .wrong-list-view .item:last-child {
            border-bottom: none;
        }
        .wrong-list-view .item .q {
            font-size: 15px;
            font-weight: 500;
        }
        .wrong-list-view .item .your {
            font-size: 14px;
            color: #c0392b;
        }
        .wrong-list-view .item .correct {
            font-size: 14px;
            color: #2d7d46;
            font-weight: 600;
        }
        .home-footer {
            text-align: center;
            margin-top: 16px;
            padding: 10px 0;
        }
        .home-footer .btn-home {
            background: none;
            border: 1.5px solid #d0d7e2;
            border-radius: 30px;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: 500;
            color: #3d4e62;
            cursor: pointer;
            font-family: inherit;
            min-height: 44px;
            text-decoration: none;
            display: inline-block;
        }
        .wrong-book-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2332;
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 100;
            font-family: inherit;
            display: none;
            align-items: center;
            gap: 8px;
            min-height: 48px;
        }
        .wrong-book-btn .badge {
            background: #c0392b;
            color: #fff;
            border-radius: 20px;
            padding: 0 10px;
            font-size: 13px;
            line-height: 22px;
        }
        .back-to-practice {
            margin-top: 14px;
            text-align: center;
        }
        .back-to-practice .btn {
            background: #2d7d46;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            min-height: 44px;
        }
        @media (max-width: 380px) {
            .question-text {
                font-size: 15px;
            }
            .option-btn {
                font-size: 14px;
                padding: 12px 14px;
                min-height: 44px;
            }
            .btn-primary {
                font-size: 15px;
                min-height: 44px;
                padding: 12px;
            }
            .fill-row input {
                font-size: 14px;
                padding: 10px 12px;
                min-height: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="header-title">🧬 语言记忆 · <span>第六章</span></div>
            <div class="header-right">
                <a class="header-home" href="index.html">🏠 首页</a>
                <div class="header-stats" id="statsLabel">0 / 0</div>
            </div>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-label">
            <span id="correctRate">✅ 正确率：--%</span>
            <span id="wrongCount">❌ 错题：0</span>
        </div>
    </div>

    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📚 全部</button>
        <button class="filter-btn" data-filter="6.1" onclick="setFilter('6.1')">§6.1 细胞增殖</button>
        <button class="filter-btn" data-filter="6.2" onclick="setFilter('6.2')">§6.2 细胞分化</button>
        <button class="filter-btn" data-filter="6.3" onclick="setFilter('6.3')">§6.3 衰老凋亡癌变</button>
        <button class="filter-btn wrong-filter" data-filter="wrong" onclick="setFilter('wrong')">📕 错题本</button>
    </div>

    <div id="questionContainer"></div>

    <div class="home-footer">
        <a class="btn-home" href="index.html">🏠 返回首页</a>
    </div>

    <button class="wrong-book-btn" id="wrongBookBtn" onclick="setFilter('wrong')">
        📕 错题本 <span class="badge" id="wrongBadge">0</span>
    </button>

    <script>
        // ================================================================
        // 第六章题库（30题）
        // ================================================================
        var questionBank = [{
            id: 1,
            type: 'choice',
            section: '6.1',
            question: '细胞不能无限长大的原因是（　）',
            options: ['细胞膜面积有限', '细胞核控制范围有限和相对表面积减小', '细胞器数量有限', '细胞质浓度过高'],
            correct: 1,
            explanation: '细胞不能无限长大：①表面积与体积之比减小，物质运输效率低；②细胞核控制范围有限。'
        }, {
            id: 2,
            type: 'choice',
            section: '6.1',
            question: '细胞周期中，间期占整个细胞周期的比例约为（　）',
            options: ['5%~10%', '50%', '90%~95%', '100%'],
            correct: 2,
            explanation: '细胞周期中间期占90%~95%，分裂期占5%~10%。间期完成DNA复制和蛋白质合成。',
            tip: '只有连续分裂的细胞才有细胞周期。'
        }, {
            id: 3,
            type: 'choice',
            section: '6.1',
            question: '有丝分裂后期的主要特点是（　）',
            options: ['染色体排列在赤道板上', '核膜核仁消失', '着丝点分裂，染色体数目加倍', '细胞板形成'],
            correct: 2,
            explanation: '后期着丝点分裂，姐妹染色单体分开，染色体数目加倍。',
            mnemonic: '📝 口诀："膜仁消失现两体，形定数晰赤道齐，点裂数加均两极，两消两现质分离。"'
        }, {
            id: 4,
            type: 'choice',
            section: '6.1',
            question: '有丝分裂中，染色体形态最清晰的时期是（　）',
            options: ['前期', '中期', '后期', '末期'],
            correct: 1,
            explanation: '中期染色体排列在赤道板上，形态最清晰，是观察染色体的最佳时期。'
        }, {
            id: 5,
            type: 'choice',
            section: '6.1',
            question: '动植物细胞有丝分裂末期的主要区别是（　）',
            options: ['纺锤体形成方式不同', '植物细胞形成细胞板，动物细胞膜凹陷缢裂', '染色体数目不同', 'DNA复制方式不同'],
            correct: 1,
            explanation: '末期：植物细胞在赤道板位置形成细胞板，最终形成细胞壁；动物细胞膜从中部向内凹陷缢裂。'
        }, {
            id: 6,
            type: 'choice',
            section: '6.1',
            question: '有丝分裂的意义是（　）',
            options: ['增加细胞种类', '保持遗传性状稳定性', '产生生殖细胞', '使细胞无限增殖'],
            correct: 1,
            explanation: '有丝分裂将亲代细胞的染色体精确平均分配到两个子细胞中，保持了细胞的遗传性状稳定性。'
        }, {
            id: 7,
            type: 'choice',
            section: '6.1',
            question: '无丝分裂的典型例子是（　）',
            options: ['受精卵分裂', '蛙的红细胞分裂', '癌细胞分裂', '植物根尖细胞分裂'],
            correct: 1,
            explanation: '蛙的红细胞进行无丝分裂，无染色体和纺锤体出现。'
        }, {
            id: 8,
            type: 'fill',
            section: '6.1',
            question: '细胞周期包括【1】和分裂期两个阶段。',
            blanks: ['间期'],
            explanation: '细胞周期包括分裂间期和分裂期，间期在前，占90%~95%。'
        }, {
            id: 9,
            type: 'fill',
            section: '6.1',
            question: '有丝分裂后期，着丝点分裂，染色体数目【1】。',
            blanks: ['加倍'],
            explanation: '有丝分裂后期着丝点分裂，姐妹染色单体分开，染色体数目加倍。'
        }, {
            id: 10,
            type: 'fill',
            section: '6.1',
            question: '动物细胞有丝分裂前期，由【1】发出星射线形成纺锤体。',
            blanks: ['中心体'],
            explanation: '动物细胞有丝分裂前期由中心体发出星射线形成纺锤体；植物细胞由细胞两极发出纺锤丝。'
        }, {
            id: 11,
            type: 'choice',
            section: '6.2',
            question: '细胞分化的实质是（　）',
            options: ['遗传物质改变', '基因的选择性表达', '细胞数目增多', '细胞体积增大'],
            correct: 1,
            explanation: '细胞分化的实质是基因的选择性表达，遗传物质不变。',
            tip: '细胞分化过程中遗传物质不变！'
        }, {
            id: 12,
            type: 'choice',
            section: '6.2',
            question: '细胞分化过程中，遗传物质（　）',
            options: ['发生改变', '不变', '减半', '加倍'],
            correct: 1,
            explanation: '细胞分化过程中遗传物质不变，只是基因选择性表达。'
        }, {
            id: 13,
            type: 'choice',
            section: '6.2',
            question: '细胞全能性大小的比较，正确的是（　）',
            options: ['体细胞 > 生殖细胞 > 受精卵', '受精卵 > 生殖细胞 > 体细胞', '动物细胞 > 植物细胞', '所有细胞一样大'],
            correct: 1,
            explanation: '全能性大小：受精卵 > 生殖细胞 > 体细胞；植物细胞 > 动物细胞。'
        }, {
            id: 14,
            type: 'choice',
            section: '6.2',
            question: '下列体现细胞全能性的是（　）',
            options: ['皮肤细胞补充受损细胞', '植物组织培养成完整植株', '细胞体积增大', '细胞数目增多'],
            correct: 1,
            explanation: '植物组织培养成完整植株体现了细胞的全能性。'
        }, {
            id: 15,
            type: 'fill',
            section: '6.2',
            question: '细胞分化的实质是【1】。',
            blanks: ['基因的选择性表达'],
            explanation: '细胞分化的实质是基因的选择性表达。'
        }, {
            id: 16,
            type: 'fill',
            section: '6.2',
            question: '已经分化的细胞仍然具有发育成完整个体的潜能，这叫【1】。',
            blanks: ['细胞全能性'],
            explanation: '细胞全能性：已经分化的细胞仍具有发育成完整个体的潜能。'
        }, {
            id: 17,
            type: 'choice',
            section: '6.3',
            question: '细胞衰老的特征不包括（　）',
            options: ['水分减少', '酶活性降低', '色素积累', '细胞核体积缩小'],
            correct: 3,
            explanation: '细胞衰老时细胞核体积增大，不是缩小。口诀："一大一小两多两慢"。',
            mnemonic: '📝 口诀："一大一小两多两慢"——核大、细胞小、色素多、酶少、呼吸慢、代谢慢。'
        }, {
            id: 18,
            type: 'choice',

        // ================================================================
        // 存储
        // ================================================================
        var STORAGE_KEY = 'ch6_vocab_data';
        var WRONG_KEY = 'ch6_wrong_data';

        function loadData() {
            try { var raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
            return { answered: {}, results: {} };
        }

        function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

        function loadWrong() {
            try { var raw = localStorage.getItem(WRONG_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
            return [];
        }

        function saveWrong(list) { localStorage.setItem(WRONG_KEY, JSON.stringify(list)); }

        var data = loadData();
        var wrongList = loadWrong();

        var currentFilter = 'all';
        var filteredIds = [];
        var currentQ = null;
        var isAnswered = false;
        var isPracticeMode = false;

        function getFilteredIds(filter) {
            if (filter === 'all') return questionBank.map(function(q) { return q.id; });
            if (filter === 'wrong') {
                return wrongList.filter(function(item) { return item.chapter === 6 && item.type === 'vocab'; })
                    .map(function(item) { return item.qId; });
            }
            return questionBank.filter(function(q) { return q.section === filter; }).map(function(q) { return q.id; });
        }

        function getQ(id) {
            for (var i = 0; i < questionBank.length; i++) {
                if (questionBank[i].id === id) return questionBank[i];
            }
            return null;
        }

        function shuffle(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
            return arr;
        }

        function getUnanswered(ids) {
            var result = [];
            for (var i = 0; i < ids.length; i++) {
                if (!data.answered[ids[i]]) result.push(ids[i]);
            }
            return result;
        }

        function getProgress() {
            var total = filteredIds.length;
            var done = 0,
                correct = 0;
            for (var i = 0; i < filteredIds.length; i++) {
                var id = filteredIds[i];
                if (data.answered[id]) {
                    done++;
                    if (data.results[id] === true) correct++;
                }
            }
            var rate = done === 0 ? 0 : Math.round((correct / done) * 100);
            return { total: total, done: done, correct: correct, rate: rate };
        }

        function updateUI() {
            var p = getProgress();
            var wc = wrongList.filter(function(item) { return item.chapter === 6 && item.type === 'vocab'; }).length;
            document.getElementById('statsLabel').textContent = p.done + ' / ' + p.total;
            document.getElementById('progressFill').style.width = (p.total === 0 ? 0 : (p.done / p.total) * 100) + '%';
            document.getElementById('correctRate').textContent = '✅ 正确率：' + (p.done === 0 ? '--%' : p.rate + '%');
            document.getElementById('wrongCount').textContent = '❌ 错题：' + wc;
            document.getElementById('wrongBadge').textContent = wc;
            var btn = document.getElementById('wrongBookBtn');
            btn.style.display = (wc > 0 && currentFilter !== 'wrong') ? 'flex' : 'none';
            var idxData = JSON.parse(localStorage.getItem('bio_index_data') || '{"doneMap":{}}');
            idxData.doneMap['ch6_vocab'] = p.done;
            localStorage.setItem('bio_index_data', JSON.stringify(idxData));
        }

        function addWrong(q, userAns) {
            if (wrongList.some(function(item) { return item.chapter === 6 && item.type === 'vocab' && item.qId === q
                    .id; })) return;
            var correctAns = '';
            if (q.type === 'choice') correctAns = q.options[q.correct];
            else if (q.type === 'fill') correctAns = q.blanks.join('、');
            wrongList.push({
                chapter: 6,
                type: 'vocab',
                qId: q.id,
                question: q.question,
                userAnswer: userAns || '',
                correctAnswer: correctAns
            });
            saveWrong(wrongList);
        }

        function removeWrong(qId) {
            wrongList = wrongList.filter(function(item) {
                return !(item.chapter === 6 && item.type === 'vocab' && item.qId === qId);
            });
            saveWrong(wrongList);
        }

        function render() {
            var container = document.getElementById('questionContainer');

            if (currentFilter === 'wrong' && !isPracticeMode) {
                var list = wrongList.filter(function(item) { return item.chapter === 6 && item.type === 'vocab'; });
                if (list.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><p>错题本已清空！</p></div>';
                    updateUI();
                    return;
                }
                var html = '<div class="wrong-list-view"><div class="title">📕 错题本（' + list.length + '题）</div>';
                list.forEach(function(item) {
                    html += '<div class="item">';
                    html += '<div class="q">' + item.question + '</div>';
                    html += '<div class="your">❌ 你的答案：' + (item.userAnswer || '未填写') + '</div>';
                    html += '<div class="correct">✅ 正确答案：' + item.correctAnswer + '</div>';
                    html += '</div>';
                });
                html +=
                    '<div class="back-to-practice"><button class="btn" onclick="startPractice()">🔄 重练错题</button></div>';
                html += '</div>';
                container.innerHTML = html;
                updateUI();
                return;
            }

            if (filteredIds.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>当前暂无题目</p></div>';
                updateUI();
                return;
            }

            var unanswered = getUnanswered(filteredIds);
            if (unanswered.length === 0) {
                var p = getProgress();
                var msg = isPracticeMode ? '🎉 错题已全部消灭！' : '🎉 全部通关！';
                container.innerHTML =
                    '<div class="complete-screen">' +
                    '<div class="big-icon">🎉</div><h2>' + msg + '</h2>' +
                    '<div class="score-big">' + p.rate + '%</div>' +
                    '<p style="color:#6b7a8f;font-size:14px;">正确率 ' + p.rate + '% · 共 ' + filteredIds.length + ' 题</p>';
                if (isPracticeMode) {
                    container.innerHTML +=
                        '<button class="btn-primary" style="margin-top:20px;max-width:200px;display:inline-block;" onclick="exitPractice()">🔙 退出练习</button>';
                } else {
                    container.innerHTML +=
                        '<button class="btn-primary" style="margin-top:20px;max-width:200px;display:inline-block;" onclick="resetAll()">🔄 重新开始</button>';
                }
                container.innerHTML += '</div>';
                updateUI();
                return;
            }

            var targetId = unanswered[0];
            var q = getQ(targetId);
            if (!q) { container.innerHTML = '<div class="empty-state"><p>加载失败</p></div>'; return; }

            currentQ = q;
            isAnswered = false;

            var html = '<div class="question-card">';
            var typeLabel = q.type === 'choice' ? '🎯 选择题' : '✍️ 填空题';
            var sectionName = '';
            if (q.section === '6.1') sectionName = '§6.1 细胞增殖';
            else if (q.section === '6.2') sectionName = '§6.2 细胞分化';
            else if (q.section === '6.3') sectionName = '§6.3 衰老凋亡癌变';
            html += '<span class="question-type">' + typeLabel + '</span>';
            html += '<span class="question-section">' + sectionName + '</span>';
            if (isPracticeMode) html += '<span class="wrong-tag">📕 错题练习</span>';
            var isW = wrongList.some(function(item) { return item.chapter === 6 && item.type === 'vocab' && item.qId ===
                    q.id; });
            if (isW && currentFilter !== 'wrong') html += '<span class="wrong-tag">📕 错题</span>';
            if (data.answered[q.id]) {
                if (data.results[q.id] === true) html += '<span class="status-badge done">✅ 已掌握</span>';
                else html += '<span class="status-badge wrong">❌ 需重练</span>';
            }

            var displayText = q.question;
            if (q.type === 'fill' && q.blanks) {
                for (var b = 0; b < q.blanks.length; b++) {
                    displayText = displayText.replace('【' + (b + 1) + '】', '<span class="blank">____</span>');
                }
            }
            html += '<div class="question-text">' + displayText + '</div>';

            if (q.type === 'choice') {
                var labels = ['A', 'B', 'C', 'D'];
                html += '<div class="options">';
                for (var i = 0; i < q.options.length; i++) {
                    html += '<button class="option-btn" onclick="handleChoice(' + i + ',' + q.id + ')" id="opt_' + i +
                        '">' +
                        '<span class="option-label">' + labels[i] + '.</span> ' + q.options[i] +
                        '</button>';
                }
                html += '</div>';
                html += '<div class="explanation" id="exp_' + q.id + '">';
                html += '<span class="label">📖 解析：</span>' + q.explanation;
                if (q.tip) html += '<div class="tip-yellow"><strong>🟡 ' + q.tip + '</strong></div>';
                if (q.mnemonic) html += '<div class="mnemonic">' + q.mnemonic + '</div>';
                html += '</div>';
                html +=
                    '<div class="action-row"><button class="btn-primary" id="nextBtn" onclick="goNext()" disabled>下一题 →</button></div>';
            } else {
                html += '<div class="fill-input-area">';
                for (var f = 0; f < q.blanks.length; f++) {
                    html += '<div class="fill-row">';
                    html += '<label>空' + (f + 1) + '：</label>';
                    html += '<input type="text" id="fill_' + q.id + '_' + f + '" placeholder="输入答案" autocomplete="off">';
                    html += '<span class="correct-answer-hint" id="fillHint_' + q.id + '_' + f +
                    '" style="display:none;"></span>';
                    html += '</div>';
                }
                html += '</div>';
                html +=
                    '<div class="action-row"><button class="btn-primary" id="fillSubmitBtn" onclick="handleFill(' + q.id +
                    ')">✅ 提交答案</button></div>';
                html += '<div class="explanation" id="exp_' + q.id + '">';
                html += '<span class="label">📖 解析：</span>' + q.explanation;
                if (q.tip) html += '<div class="tip-yellow"><strong>🟡 ' + q.tip + '</strong></div>';
                if (q.mnemonic) html += '<div class="mnemonic">' + q.mnemonic + '</div>';
                html += '</div>';
                html +=
                    '<div class="action-row"><button class="btn-primary" id="nextBtnFill" onclick="goNext()" disabled>下一题 →</button></div>';
            }
            html += '</div>';
            container.innerHTML = html;
            updateUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (q.type === 'fill') {
                setTimeout(function() {
                    var inputs = document.querySelectorAll('.fill-row input');
                    inputs.forEach(function(inp, idx) {
                        inp.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                if (idx === inputs.length - 1) {
                                    handleFill(q.id);
                                } else {
                                    inputs[idx + 1].focus();
                                }
                            }
                        });
                    });
                    if (inputs.length > 0 && !isAnswered) inputs[0].focus();
                }, 100);
            }
        }

        function handleChoice(selected, qId) {
            if (isAnswered) return;
            var q = getQ(qId);
            if (!q) return;
            isAnswered = true;

            var isCorrect = (selected === q.correct);
            var btns = document.querySelectorAll('.option-btn');
            btns.forEach(function(b) { b.classList.add('disabled'); });

            if (isCorrect) {
                btns[selected].classList.add('selected-correct');
                data.results[qId] = true;
                removeWrong(qId);
            } else {
                btns[selected].classList.add('selected-wrong');
                btns[q.correct].classList.add('show-correct');
                data.results[qId] = false;
                addWrong(q, q.options[selected]);
            }
            data.answered[qId] = true;
            saveData(data);

            var exp = document.getElementById('exp_' + qId);
            if (exp) exp.classList.add('show');

            var nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.disabled = false;

            if (isPracticeMode) {
                var remaining = wrongList.filter(function(item) {
                    return item.chapter === 6 && item.type === 'vocab' && !data.answered[item.qId];
                });
                if (remaining.length === 0) {
                    render();
                    return;
                }
                var ids = wrongList.filter(function(item) {
                    return item.chapter === 6 && item.type === 'vocab';
                }).map(function(item) { return item.qId; });
                var unanswered = [];
                for (var i = 0; i < ids.length; i++) {
                    if (!data.answered[ids[i]]) unanswered.push(ids[i]);
                }
                filteredIds = shuffle(unanswered);
            }

            updateUI();
        }

        function handleFill(qId) {
            if (isAnswered) return;
            var q = getQ(qId);
            if (!q || q.type !== 'fill') return;

            var allCorrect = true;
            var allFilled = true;
            var userAnswers = [];

            for (var i = 0; i < q.blanks.length; i++) {
                var input = document.getElementById('fill_' + q.id + '_' + i);
                if (!input) { allFilled = false; continue; }
                var userVal = input.value.trim();
                userAnswers.push(userVal);
                if (userVal === '') { allFilled = false; continue; }
                if (userVal.replace(/\s/g, '') === q.blanks[i].replace(/\s/g, '')) {
                    input.classList.add('correct');
                } else {
                    input.classList.add('wrong');
                    allCorrect = false;
                    var hint = document.getElementById('fillHint_' + q.id + '_' + i);
                    if (hint) {
                        hint.style.display = 'inline';
                        hint.textContent = '→ 正确答案：' + q.blanks[i];
                    }
                }
                input.disabled = true;
            }

            if (!allFilled) { alert('请填写所有空再提交'); return; }

            isAnswered = true;
            if (allCorrect) {
                data.results[qId] = true;
                removeWrong(qId);
            } else {
                data.results[qId] = false;
                addWrong(q, userAnswers.join('、'));
            }
            data.answered[qId] = true;
            saveData(data);

            var exp = document.getElementById('exp_' + qId);
            if (exp) exp.classList.add('show');

            var submitBtn = document.getElementById('fillSubmitBtn');
            if (submitBtn) submitBtn.disabled = true;

            var nextBtn = document.getElementById('nextBtnFill');
            if (nextBtn) nextBtn.disabled = false;

            if (isPracticeMode) {
                var remaining = wrongList.filter(function(item) {
                    return item.chapter === 6 && item.type === 'vocab' && !data.answered[item.qId];
                });
                if (remaining.length === 0) {
                    render();
                    return;
                }
                var ids = wrongList.filter(function(item) {
                    return item.chapter === 6 && item.type === 'vocab';
                }).map(function(item) { return item.qId; });
                var unanswered = [];
                for (var i = 0; i < ids.length; i++) {
                    if (!data.answered[ids[i]]) unanswered.push(ids[i]);
                }
                filteredIds = shuffle(unanswered);
            }

            updateUI();
        }

        function goNext() {
            if (isPracticeMode) {
                var ids = wrongList.filter(function(item) {
                    return item.chapter === 6 && item.type === 'vocab';
                }).map(function(item) { return item.qId; });
                var unanswered = [];
                for (var i = 0; i < ids.length; i++) {
                    if (!data.answered[ids[i]]) unanswered.push(ids[i]);
                }
                if (unanswered.length === 0) {
                    render();
                    return;
                }
                filteredIds = shuffle(unanswered);
                render();
                return;
            }
            render();
        }

        function setFilter(filter) {
            if (filter === 'wrong') {
                var wc = wrongList.filter(function(item) { return item.chapter === 6 && item.type === 'vocab'; }).length;
                if (wc === 0) { alert('🎉 错题本为空！'); return; }
                isPracticeMode = false;
                currentFilter = 'wrong';
                var btns = document.querySelectorAll('.filter-btn');
                btns.forEach(function(b) { b.classList.toggle('active', b.dataset.filter === filter); });
                render();
                return;
            }
            isPracticeMode = false;
            currentFilter = filter;
            var btns = document.querySelectorAll('.filter-btn');
            btns.forEach(function(b) { b.classList.toggle('active', b.dataset.filter === filter); });
            filteredIds = shuffle(getFilteredIds(filter));
            render();
        }

        function startPractice() {
            var ids = wrongList.filter(function(item) { return item.chapter === 6 && item.type === 'vocab'; })
                .map(function(item) { return item.qId; });
            if (ids.length === 0) { alert('错题本为空'); return; }
            isPracticeMode = true;
            currentFilter = 'practice';
            filteredIds = shuffle(ids.slice());
            var btns = document.querySelectorAll('.filter-btn');
            btns.forEach(function(b) { b.classList.remove('active'); });
            render();
        }

        function exitPractice() {
            isPracticeMode = false;
            currentFilter = 'all';
            filteredIds = shuffle(getFilteredIds('all'));
            var btns = document.querySelectorAll('.filter-btn');
            btns.forEach(function(b) { b.classList.remove('active'); });
            document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
            render();
        }

        function resetAll() {
            if (!confirm('重置所有进度？')) return;
            data = { answered: {}, results: {} };
            saveData(data);
            wrongList = [];
            saveWrong(wrongList);
            if (isPracticeMode) { isPracticeMode = false; }
            currentFilter = 'all';
            filteredIds = shuffle(getFilteredIds('all'));
            var btns = document.querySelectorAll('.filter-btn');
            btns.forEach(function(b) { b.classList.remove('active'); });
            document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
            render();
        }
